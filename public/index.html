    <style>
        .carousel-indicators [data-bs-target] {
            box-sizing: content-box;
            flex: 0 0 auto;
            width: 10px;
            height: 0px;
            padding: 0;
            margin-right: 3px;
            margin-left: 3px;
            text-indent: -999px;
            cursor: pointer;
            background-color: #000;
            /* background-clip: padding-box; */
            border-radius: 15px;
            border-top: 10px solid #fff;
            border-bottom: 3px solid #fff;
            opacity: .5;
            transition: opacity .6s ease;
        }

        .carousel-indicators .active {
            opacity: 1;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #333;
            /* Dark background */
            padding: 8px 16px;
            color: #fff;
            /* White text */
            font-family: Arial, sans-serif;
            font-size: 14px;
            position: relative;
            z-index: 1000;
        }

        .user-section {
            display: flex;
            align-items: center;
            gap: 8px;
            /* Space between icon and text */
        }

        .share-icon {
            width: 20px;
            height: 20px;
            object-fit: contain;
        }

        .user-details {
            white-space: nowrap;
            /* Prevent text from wrapping */
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .stop-presenting {
            background-color: #4a90e2;
            /* Blue button */
            color: #fff;
            /* White text */
            border: none;
            border-radius: 15px;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 14px;
            font-family: Arial, sans-serif;
        }

        .stop-presenting:hover {
            background-color: #357abd;
            /* Darker blue on hover */
        }

        .center-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 90vh;
            /* Full viewport height for centering */
            background-color: #333;
            /* Creamish background */
        }

        .center-container .video-card {
            background-color: #333;
            /* Dark card background */
            /* border-radius: 10px;
            padding: 16px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); */

            /* width: 100%;
            max-width: 100%; */
        }

        .center-container .video-card video {
            /* width: 55%; */
            /* border-radius: 10px; */
            margin: 0 auto;
            display: flex
        }

        /* Grid container for the video layout */
        /* .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            /* 2 columns 
            grid-gap: 20px;
            padding: 20px;
            background-color: #2c2c2c;
            /* Optional dark background 
            height: 90vh;
            /* Full page height 
            box-sizing: border-box;
        }

        .grid-container .video-card {
            position: relative;
            background-color: #333;
            /* Dark background for fallback 
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        } */

        .video-stream {
            /* width: 100%; */
            height: 100%;
            object-fit: cover;
            /* Cover the whole card */
            border-radius: 8px;
            /* Ensuring the video fits within rounded borders */
        }

        .user-name {
            position: absolute;
            bottom: 10px;
            left: 10px;
            z-index: 2;
            /* Ensuring name is on top of the video */
            color: white;
            font-size: 18px;
            font-weight: bold;
            background-color: rgba(0, 0, 0, 0.6);
            /* Semi-transparent background */
            padding: 5px 10px;
            border-radius: 4px;
        }

        /* Styling for the control bar */
        .control-bar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background-color: #333;
            border-radius: 50px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            z-index: 1000;
        }

        .control-btn {
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 10px;
            background-color: #444;
            border-radius: 50%;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .control-btn i {
            font-size: 20px;
            color: white;
        }

        body:hover .control-bar {
            display: flex;
        }

        /* .control-btn:hover {
            background-color: #555;
        } */

        /* Red color for mute, video off, and end call buttons */
        .mic-btn,
        .video-btn,
        .end-call-btn {
            background-color: #ff4c4c;
        }

        .share-btn {
            background-color: #888;
        }

        .end-call-btn {
            background-color: #d32f2f;
            width: 80px;
            border-radius: 40px;
        }

        .end-call-btn i {
            transform: rotate(135deg);
        }

        /* On hover, emphasize the icons */
        .end-call-btn:hover {
            background-color: #f44336;
        }

        /* this is share banner section styling */
        .bagger {
            background: #888;
            position: inherit;
            /* top: 0%; */
            left: 50%;
            transform: translate(-50%, -50%);
            /* width: 100%; */
            text-align: center;
            padding-top: 1.8%;
            padding-bottom: 0.3%;
            display: flex;
            justify-content: center;

        }

        .bagger span {
            color: #fff;
            font-size: 1rem;
            font-weight: bold;

            i {
                -moz-animation-duration: 500ms;
                -moz-animation-name: blink;
                -moz-animation-iteration-count: infinite;
                -moz-animation-direction: alternate;

                -webkit-animation-duration: 500ms;
                -webkit-animation-name: blink;
                -webkit-animation-iteration-count: infinite;
                -webkit-animation-direction: alternate;

                animation-duration: 500ms;
                animation-name: blink;
                animation-iteration-count: infinite;
                animation-direction: alternate;
                color: yellow;
                float: left;
                padding-top: 4px;
                padding-right: 0px;
                text-align: center;
                margin-right: -1.5%;
            }


        }

        .pop_up_button {
            cursor: pointer;
        }

        .pop_up_button:hover {
            opacity: 0.5;
        }

        @-moz-keyframes blink {
            from {
                opacity: 1;
            }

            to {
                opacity: 0;
            }
        }

        @-webkit-keyframes blink {
            from {
                opacity: 1;
            }

            to {
                opacity: 0;
            }
        }

        @keyframes blink {
            from {
                opacity: 1;
            }

            to {
                opacity: 0;
            }
        }

        /* share banner css ended */
        /* this is pop up share social */
        #share-btn {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .popup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            z-index: 1000;
            /* width: 350px; */
            padding: 20px;
        }

        .popup-content {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .close-btn {
            position: absolute;
            top: 5px;
            right: 15px;
            font-size: 28px;
            cursor: pointer;
            color: #555;
        }

        .close-btn:hover {
            color: black;
            font-weight: 600;
        }

        .share-icons {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            gap: 25px;
        }

        .icon {
            text-decoration: none;
            font-size: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            transition: background 0.3s ease;

        }

        .whatsapp {
            background: #25d366;
            color: white;
        }

        .facebook {
            background: #1877f2;
            color: white;
        }

        .twitter {
            background: #000;
            color: white;
        }

        .email {
            background: #808080;
            color: white;
        }

        .linkedin {
            background: #0077B5;
            color: white;
        }

        .align {
            display: flex;
            justify-content: space-between;
            gap: 15px;
        }

        #share-link {
            width: calc(100% - 70px);
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 0.85rem;
        }

        #copy-btn {
            padding: 8px 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .icon:hover {
            opacity: 0.8;
        }

        /* pop up share social css ended */
    </style>

            height: 50vh;
            margin: auto;
        }
    </style>
</head>
